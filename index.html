<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore Wakulla County</title>
<!--
  ============================================================
  EXPLORE WAKULLA - 3D visitor map (MapLibre GL JS)
  ============================================================
  HOW TO EDIT (most of the time you only touch ArcGIS Online):

  1. Places and wildlife come live from ArcGIS Online feature layers.
     Add, move, or edit a point in AGOL and the site updates on refresh.
     Fields the map reads (case doesn't matter, blanks are skipped):
       Places:   Name (or Park), typ, Info, Address, PhotoURL (optional)
       Wildlife: Name, Species, Info, PhotoURL, PhotoCredit (optional)

  2. Everything else lives in the CONFIG block below:
     layer URLs, category colors/icons, fly-over tours, start view.

  3. The layers must be shared publicly in AGOL.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root {
    --cypress: #193F23;     /* county brand green (from the AGOL app theme) */
    --spring: #1A9DAA;      /* spring-water teal */
    --sawgrass: #C99A2E;    /* salt-marsh gold, used for wildlife */
    --shell: #F4F6F1;       /* panel background */
    --ink: #17231B;
    --muted: #5B6B60;
    --line: #D9DFD6;
    --serif: "Young Serif", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --stem: 40px;
    --pin: 1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: #DCE6E0; }
  #map { position: absolute; inset: 0; }

  /* ---------- Side panel ---------- */
  .panel {
    position: absolute; z-index: 5;
    top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; bottom: 16px;
    width: 360px; display: flex; flex-direction: column;
    background: var(--shell); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 12px 40px rgba(25, 63, 35, .18);
    overflow: hidden;
  }
  .panel-head { padding: 22px 22px 14px; border-bottom: 1px solid var(--line); }
  .panel-head h1 {
    font-family: var(--serif); font-weight: 400; color: var(--cypress);
    font-size: 32px; line-height: 1.05; margin: 0 0 6px; letter-spacing: -.01em;
  }
  .panel-head p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip {
    font: 500 13px/1 var(--sans); color: var(--ink);
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 7px 11px 7px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: block; }
  .chip[aria-pressed="false"] { opacity: .45; background: transparent; }
  .chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }

  .scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .browse { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .detail { min-height: 0; }
  .section { padding: 16px 22px 6px; }
  .section h2 { font: 600 14px/1.3 var(--sans); color: var(--muted); margin: 0 0 10px; }

  .tours { display: grid; gap: 8px; }
  .tour {
    text-align: left; border: 0; cursor: pointer; border-radius: 12px;
    background: var(--cypress); color: #fff; padding: 11px 14px;
    font: 600 15px/1.2 var(--sans); display: flex; justify-content: space-between; align-items: center;
  }
  .tour span { font-weight: 400; font-size: 13px; opacity: .8; }
  .tour:hover { background: #22552F; }

  .list { list-style: none; margin: 0; padding: 0 12px 16px; }
  .row {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    background: none; border: 0; border-radius: 12px; padding: 8px 10px; cursor: pointer; color: inherit;
    font: inherit;
  }
  .row:hover { background: #E8EDE5; }
  .row .thumb {
    width: 38px; height: 38px; border-radius: 50%; flex: none; background: #fff center/70% no-repeat;
    box-shadow: 0 0 0 2px var(--c);
  }
  .row .thumb.photo { background-size: cover; }
  .row b { display: block; font-weight: 600; font-size: 15px; }
  .row small { color: var(--muted); font-size: 13px; }
  .status { padding: 12px 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .status.error { color: #8A2B1E; }

  /* ---------- Detail card ---------- */
  .detail { display: none; }
  .panel.showing-detail .browse { display: none; }
  .panel.showing-detail .detail { display: block; }
  .back {
    border: 0; background: none; color: var(--cypress); cursor: pointer;
    font: 600 14px var(--sans); padding: 16px 22px 6px;
  }
  .detail-hero { margin: 8px 22px 0; border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; background: #E1E8DD center/cover; }
  .detail-hero.icon { background-size: 35%; background-repeat: no-repeat; background-color: #fff; border: 1px solid var(--line); }
  .detail-body { padding: 16px 22px 24px; }
  .detail-body .cat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .detail-body .cat i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .detail-body h3 { font-family: var(--serif); font-weight: 400; font-size: 27px; line-height: 1.15; margin: 6px 0 10px; color: var(--cypress); }
  .detail-body p { font-size: 15px; line-height: 1.55; margin: 0 0 12px; max-width: 62ch; }
  .detail-body .addr { color: var(--muted); font-size: 14px; }
  .credit { color: var(--muted); font-size: 12px; }
  .directions {
    display: inline-block; margin-top: 6px; background: var(--spring); color: #fff; text-decoration: none;
    padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 15px;
  }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--sawgrass); outline-offset: 2px; }

  /* ---------- Billboard pins ---------- */
  .pin {
    background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    transform-origin: bottom center;
  }
  .pin-head {
    width: calc(46px * var(--pin)); height: calc(46px * var(--pin)); border-radius: 50%;
    background: #fff center/68% no-repeat; border: 3px solid var(--c);
    box-shadow: 0 6px 14px rgba(0,0,0,.28);
    transition: transform .15s ease;
  }
  .pin.wild .pin-head { width: calc(58px * var(--pin)); height: calc(58px * var(--pin)); background-size: cover; border-width: 3px; }
  .pin-stem { width: 2px; height: var(--stem); background: linear-gradient(var(--c), rgba(255,255,255,.9)); }
  .pin-foot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
  .pin-label {
    position: absolute; bottom: calc(var(--stem) + 8px + 50px * var(--pin)); left: 50%; transform: translateX(-50%);
    white-space: nowrap; font: 600 12px/1 var(--sans); color: var(--ink);
    background: rgba(255,255,255,.92); border-radius: 999px; padding: 5px 9px; display: none;
    pointer-events: none;
  }
  .pin.wild .pin-label { bottom: calc(var(--stem) + 8px + 62px * var(--pin)); }
  .show-labels .pin-label, .pin:hover .pin-label, .pin:focus-visible .pin-label, .pin.active .pin-label { display: block; }
  .pin:hover .pin-head, .pin.active .pin-head { transform: scale(1.12); }
  .pin.active { z-index: 3; }
  .pin:focus-visible .pin-head { outline: 3px solid var(--sawgrass); outline-offset: 2px; }
  .pin[hidden] { display: none; }

  .maplibregl-ctrl-group { border-radius: 12px !important; }

  /* ---------- Mobile: bottom sheet ---------- */
  @media (max-width: 720px) {
    .panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 46vh;
      border-radius: 20px 20px 0 0; border-bottom: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .panel-head { padding: 16px 18px 12px; }
    .panel-head h1 { font-size: 26px; }
    .section { padding: 14px 18px 4px; }
    .tours { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) { .pin-head { transition: none; } }
</style>
</head>

<div id="map" aria-label="3D map of Wakulla County"></div>

/* ============================================================
   APP - no edits needed below this line
   ============================================================ */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const items = [];
const markers = new Map();
const hiddenCats = new Set();
let activeId = null;
let tourToken = 0;

$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;

function iconFor(cat) {
  const c = CONFIG.categories[cat];
  if (!c || !c.icon) return null;
  if (c.icon.startsWith("EXISTING:")) return EXISTING_ICONS[c.icon.slice(9)] || null;
  return c.icon;
}
function colorFor(cat) { return (CONFIG.categories[cat] || {}).color || "#5B6B60"; }
function labelFor(cat) { return (CONFIG.categories[cat] || {}).label || cat; }

// Case-insensitive field lookup that skips blanks
function pick(props, names) {
  if (!names) return "";
  const keys = Object.keys(props || {});
  for (const n of names) {
    const k = keys.find((key) => key.toLowerCase() === n.toLowerCase());
    if (k && props[k] != null && String(props[k]).trim() !== "") return String(props[k]).trim();
  }
  return "";
}

async function queryLayer(url) {
  const q = url.replace(/\/+$/, "") + "/query?where=1%3D1&outFields=*&outSR=4326&f=geojson";
  const res = await fetch(q);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "ArcGIS error");
  return data;
}

const map = new maplibregl.Map({
  container: "map",
  style: CONFIG.basemapStyle,
  center: CONFIG.startView.center,
  zoom: CONFIG.startView.zoom - (window.innerWidth <= 720 ? 1.1 : 0),
  pitch: CONFIG.startView.pitch,
  bearing: CONFIG.startView.bearing,
  maxPitch: 72,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), "top-right");

map.on("load", async () => {
  softenBasemap();
  if (CONFIG.terrain.enabled) addTerrain();
  loadOutline();
  await loadLayers();
  updatePinScale();
});

function softenBasemap() {
  for (const layer of map.getStyle().layers) {
    try {
      if (layer.type === "background") map.setPaintProperty(layer.id, "background-color", "#EEF2EA");
      if (layer.type === "fill" && /water/.test(layer.id)) map.setPaintProperty(layer.id, "fill-color", "#9FD3D6");
    } catch (e) { /* some style layers use expressions; skip them */ }
  }
}

function firstSymbolLayerId() {
  const l = map.getStyle().layers.find((x) => x.type === "symbol");
  return l ? l.id : undefined;
}

function addTerrain() {
  const tiles = ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"];
  const src = { type: "raster-dem", tiles, encoding: "terrarium", tileSize: 256, maxzoom: 14,
    attribution: '<a href="https://registry.opendata.aws/terrain-tiles/">Terrain Tiles</a>' };
  map.addSource("dem", src);
  map.addSource("dem-shade", { ...src });
  map.setTerrain({ source: "dem", exaggeration: CONFIG.terrain.exaggeration });
  map.addLayer({ id: "hillshade", type: "hillshade", source: "dem-shade",
    paint: { "hillshade-shadow-color": "#193F23", "hillshade-highlight-color": "#FFFFFF", "hillshade-exaggeration": 0.35 } },
    firstSymbolLayerId());
}

async function loadOutline() {
  if (!CONFIG.countyOutlineUrl) return;
  try {
    const data = await queryLayer(CONFIG.countyOutlineUrl);
    map.addSource("county", { type: "geojson", data });
    map.addLayer({ id: "county-glow", type: "line", source: "county",
      paint: { "line-color": "#1A9DAA", "line-width": 10, "line-opacity": 0.18, "line-blur": 4 } });
    map.addLayer({ id: "county-line", type: "line", source: "county",
      paint: { "line-color": "#193F23", "line-width": 2, "line-dasharray": [3, 2] } });
  } catch (e) { console.warn("County outline did not load:", e); }
}

async function loadLayers() {
  const problems = [];
  for (const layer of CONFIG.layers) {
    let features = [];
    try {
      if (layer.url) {
        const data = await queryLayer(layer.url);
        features = data.features.map((f) => ({ props: f.properties, coords: f.geometry && f.geometry.coordinates }));
      } else if (layer.demoData === "DEMO_WILDLIFE") {
        features = DEMO_WILDLIFE.map((d) => ({
          props: { Name: d.name, Species: d.species, Info: d.info, PhotoURL: d.photo, PhotoCredit: d.credit },
          coords: [d.lon, d.lat] }));
      }
    } catch (e) {
      problems.push(layer.kind);
      console.warn(layer.kind + " layer did not load:", e);
      continue;
    }
    features.forEach((f, i) => {
      if (!f.coords) return;
      const p = f.props, F = layer.fields;
      const item = {
        id: layer.kind + "-" + i,
        kind: layer.kind,
        name: pick(p, F.name) || "Unnamed place",
        category: layer.kind === "wildlife" ? "Wildlife" : (pick(p, F.category) || "Other"),
        species: pick(p, F.species),
        info: pick(p, F.info),
        address: pick(p, F.address),
        photo: pick(p, F.photo),
        credit: pick(p, F.credit),
        lngLat: [f.coords[0], f.coords[1]]
      };
      items.push(item);
      addPin(item);
    });
  }
  renderChips();
  renderList();
  const status = $("status");
  if (problems.length) {
    status.className = "status error";
    status.textContent = "Some points didn't load (" + problems.join(", ") +
      "). Check that the layer is shared publicly in ArcGIS Online and that its URL in CONFIG ends in /FeatureServer/0.";
  } else {
    status.remove();
  }
}

function addPin(item) {
  const el = document.createElement("button");
  el.className = "pin" + (item.kind === "wildlife" ? " wild" : "");
  el.style.setProperty("--c", colorFor(item.category));
  el.setAttribute("aria-label", item.name);
  const head = document.createElement("span");
  head.className = "pin-head";
  const img = item.photo || iconFor(item.category);
  if (img) head.style.backgroundImage = "url('" + img.replace(/'/g, "%27") + "')";
  if (item.photo) head.style.backgroundSize = "cover";
  const label = document.createElement("span");
  label.className = "pin-label";
  label.textContent = item.kind === "wildlife" && item.species ? item.species : item.name;
  el.append(label, head, Object.assign(document.createElement("span"), { className: "pin-stem" }),
    Object.assign(document.createElement("span"), { className: "pin-foot" }));
  el.addEventListener("click", (e) => { e.stopPropagation(); select(item.id); });
  const marker = new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat(item.lngLat).addTo(map);
  markers.set(item.id, marker);
}

function renderChips() {
  const present = [...new Set(items.map((i) => i.category))];
  const order = Object.keys(CONFIG.categories);
  present.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const wrap = $("chips");
  wrap.innerHTML = "";
  present.forEach((cat) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.style.setProperty("--c", colorFor(cat));
    b.setAttribute("aria-pressed", String(!hiddenCats.has(cat)));
    b.innerHTML = "<i></i>";
    b.append(document.createTextNode(labelFor(cat)));
    b.addEventListener("click", () => {
      hiddenCats.has(cat) ? hiddenCats.delete(cat) : hiddenCats.add(cat);
      b.setAttribute("aria-pressed", String(!hiddenCats.has(cat)));
      applyFilter();
    });
    wrap.append(b);
  });
}

function renderList() {
  const order = Object.keys(CONFIG.categories);
  const sorted = [...items].sort((a, b) =>
    ((order.indexOf(a.category) + 1 || 99) - (order.indexOf(b.category) + 1 || 99)) || a.name.localeCompare(b.name));
  const list = $("list");
  list.innerHTML = "";
  sorted.forEach((item) => {
    const li = document.createElement("li");
    li.dataset.cat = item.category;
    const b = document.createElement("button");
    b.className = "row";
    const t = document.createElement("span");
    t.className = "thumb" + (item.photo ? " photo" : "");
    t.style.setProperty("--c", colorFor(item.category));
    const img = item.photo || iconFor(item.category);
    if (img) t.style.backgroundImage = "url('" + img.replace(/'/g, "%27") + "')";
    const txt = document.createElement("span");
    const name = document.createElement("b"); name.textContent = item.name;
    const sub = document.createElement("small");
    sub.textContent = item.kind === "wildlife" && item.species ? item.species : labelFor(item.category);
    txt.append(name, sub);
    b.append(t, txt);
    b.addEventListener("click", () => select(item.id));
    li.append(b);
    list.append(li);
  });
  applyFilter();
}

function applyFilter() {
  items.forEach((i) => { markers.get(i.id).getElement().hidden = hiddenCats.has(i.category); });
  document.querySelectorAll("#list li").forEach((li) => { li.hidden = hiddenCats.has(li.dataset.cat); });
}

// Keep the map's visual center clear of the panel
function framePadding() {
  return window.innerWidth > 720
    ? { left: 392, top: 0, right: 0, bottom: 0 }
    : { left: 0, top: 0, right: 0, bottom: Math.round(window.innerHeight * 0.46) };
}
function cameraOffset() { return [0, 0]; }
map.setPadding(framePadding());
window.addEventListener("resize", () => map.setPadding(framePadding()));

function select(id) {
  const item = items.find((i) => i.id === id);
  if (!item) return;
  stopTour();
  if (activeId) markers.get(activeId).getElement().classList.remove("active");
  activeId = id;
  markers.get(id).getElement().classList.add("active");
  const cam = { center: item.lngLat, zoom: Math.max(map.getZoom(), 13.5), pitch: 62, bearing: map.getBearing(), offset: cameraOffset() };
  reduceMotion ? map.jumpTo(cam) : map.flyTo({ ...cam, speed: 0.9, curve: 1.4, essential: true });
  showDetail(item);
}

function showDetail(item) {
  const d = $("detail");
  d.innerHTML = "";
  const back = Object.assign(document.createElement("button"), { className: "back", textContent: "‹ All places" });
  back.addEventListener("click", closeDetail);
  const hero = document.createElement("div");
  const img = item.photo || iconFor(item.category);
  hero.className = "detail-hero" + (item.photo ? "" : " icon");
  if (img) hero.style.backgroundImage = "url('" + img.replace(/'/g, "%27") + "')";
  const body = document.createElement("div");
  body.className = "detail-body";
  const cat = document.createElement("span");
  cat.className = "cat"; cat.style.setProperty("--c", colorFor(item.category));
  cat.innerHTML = "<i></i>";
  cat.append(document.createTextNode(item.kind === "wildlife" && item.species ? item.species : labelFor(item.category)));
  const h = document.createElement("h3"); h.textContent = item.name;
  body.append(cat, h);
  if (item.info) { const p = document.createElement("p"); p.textContent = item.info; body.append(p); }
  if (item.address) { const a = document.createElement("p"); a.className = "addr"; a.textContent = item.address; body.append(a); }
  const dir = document.createElement("a");
  dir.className = "directions"; dir.target = "_blank"; dir.rel = "noopener";
  dir.href = "https://www.google.com/maps/dir/?api=1&destination=" + item.lngLat[1] + "," + item.lngLat[0];
  dir.textContent = "Get directions";
  body.append(dir);
  if (item.photo && item.credit) { const c = document.createElement("p"); c.className = "credit"; c.textContent = "Photo: " + item.credit; c.style.marginTop = "14px"; body.append(c); }
  d.append(back, hero, body);
  $("panel").classList.add("showing-detail");
  d.scrollTop = 0;
  back.focus({ preventScroll: true });
}

function closeDetail() {
  $("panel").classList.remove("showing-detail");
  if (activeId) markers.get(activeId).getElement().classList.remove("active");
  activeId = null;
}

// Tours
function renderTours() {
  const wrap = $("tours");
  CONFIG.tours.forEach((tour) => {
    const b = document.createElement("button");
    b.className = "tour";
    b.textContent = tour.name;
    if (tour.note) { const s = document.createElement("span"); s.textContent = tour.note; b.append(s); }
    b.addEventListener("click", () => playTour(tour));
    wrap.append(b);
  });
}
function stopTour() { tourToken++; }
async function playTour(tour) {
  closeDetail();
  const token = ++tourToken;
  for (const stop of tour.stops) {
    if (token !== tourToken) return;
    const cam = { ...stop, offset: cameraOffset() };
    if (reduceMotion) { map.jumpTo(cam); }
    else {
      map.flyTo({ ...cam, duration: 5500, curve: 1.3, essential: true });
      await new Promise((r) => map.once("moveend", r));
    }
    await new Promise((r) => setTimeout(r, reduceMotion ? 2500 : 1200));
  }
}
["mousedown", "touchstart", "wheel"].forEach((ev) => map.getCanvas().addEventListener(ev, stopTour, { passive: true }));
renderTours();

// Keep billboards readable: stems grow with tilt, pins shrink when zoomed out
function updatePinScale() {
  const z = map.getZoom(), p = map.getPitch();
  const scale = Math.min(1.1, Math.max(0.62, 0.62 + (z - 9) * 0.12));
  const stem = Math.round((8 + p * 0.75) * scale);
  const root = document.documentElement.style;
  root.setProperty("--pin", scale.toFixed(2));
  root.setProperty("--stem", stem + "px");
  map.getContainer().classList.toggle("show-labels", z >= 12.5);
}
map.on("zoom", updatePinScale);
map.on("pitch", updatePinScale);
</script>
